{% extends "base.html" %}

{% block title %}
	Go
{% endblock %}

{% block content %}
<main class="max-h-screen bg-gradient-to-b from-gray-50 to-white">
    <div class="hero-section min-h-screen pt-16 flex flex-col items-center justify-center px-4 space-y-18">
        <div class="text-center max-w-4xl mx-auto">
            <span class="inline-block px-4 py-2 rounded-full text-sm font-medium bg-purple-100 text-purple-800 mb-6">
                Location de voitures simplifiée
            </span>
            <h1 class="text-4xl md:text-6xl font-bold mb-6 bg-clip-text text-transparent bg-gradient-to-r from-gray-900 to-gray-600">
                Le leader mondial de la location
                <br>
                de voitures entre particuliers
            </h1>
            <p class="text-xl text-gray-600 mb-8 max-w-2xl mx-auto">
                Louez la voiture que vous voulez, là où vous le voulez
            </p>
        </div>
        
        <!-- Search Form -->
        <form action="{% url 'search_cars' %}" method="GET" class="bg-white rounded-xl shadow-lg p-6 backdrop-blur-sm bg-white/90 w-full max-w-4xl mx-auto transition-all duration-300 hover:shadow-xl">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                <!-- Location Input -->
                <div class="col-span-1 md:col-span-6">
                    <div class="relative">
                        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500 h-5 w-5" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                            <circle cx="12" cy="10" r="3"/>
                        </svg>
                        <input
                            id="search-location"
                            name='location'
                            type="text"
                            placeholder="Ville, aéroport, adresse ou hôtel"
                            class="w-full h-12 pl-10 pr-4 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent"
                            required
                        >
                        <ul id="suggestions" class="absolute bg-white shadow-md rounded mt-1 w-full"></ul>
                    </div>
                </div>

                <!-- Start Date Input -->
                <div class="col-span-1 md:col-span-3">
                    <div class="relative max-w-md">
                        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500 h-5 w-5" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
                        </svg>
                        <input
                            id="start_date"
                            name="start_date"
                            type="text"
                            placeholder="Date de début"
                            class="w-full h-12 pl-10 pr-4 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent bg-white hover:bg-gray-50 cursor-pointer max-w-md"
                            datepicker datepicker-buttons datepicker-autoselect-today
                            datepicker-format="yyyy-mm-dd"
                            datepicker-orientation="top"
                            datepicker-min-date={"today"}
                            required
                            onkeydown="return false;"
                        >
                    </div>
                </div>

                <!-- End Date Input -->
                <div class="col-span-1 md:col-span-3">
                    <div class="relative max-w-md">
                        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500 h-5 w-5" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
                        </svg>
                        <input
                            id="end_date"
                            name="end_date"
                            type="text"
                            placeholder="Date de fin"
                            class="w-full h-12 pl-10 pr-4 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent bg-white hover:bg-gray-50 cursor-pointer max-w-md"
                            datepicker datepicker-buttons datepicker-autoselect-today
                            datepicker-format="yyyy-mm-dd"
                            datepicker-orientation="top"
                            datepicker-min-date={"today"}
                            required
                            onkeydown="return false;"
                        >
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="col-span-1 md:col-span-12">
                    <button
                        id="search-btn"
                        onclick="href"{% url "search_cars" %}""
                        type="submit"
                        class="w-full md:w-auto md:float-right px-6 py-3 bg-gradient-to-r from-purple-600 to-purple-800 text-white rounded-md hover:opacity-90 transition-all duration-200 flex items-center justify-center gap-2"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.3-4.3"/>
                        </svg>
                        Rechercher un véhicule
                    </button>
                </div>
            </div>
        </form>
    </div>
</main>
{% endblock  %}
