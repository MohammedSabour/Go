{% extends "base.html" %}

{% block title %}
	Sign Up
{% endblock %}

{% block content %}
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <div class="bg-white p-8 rounded-lg shadow-lg">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-gray-900">C'est parti !</h2>
                </div>

                <form action="{% url 'register' %}" method="POST" class="space-y-6">
                    {% csrf_token %}
                                    <!-- Affichage des messages d'erreur -->
                    {% if messages %}
                        <div class="mb-4">
                            {% for message in messages %}
                                <p class="text-red-600">{{ message }}</p>
                            {% endfor %}
                        </div>
                    {% endif %}
                    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                        <div class="space-y-2">
                            <label for="firstName" class="block text-sm font-medium text-gray-700">Prénom</label>
                            <input
                                id="firstName"
                                name="firstName"
                                type="text"
                                required
                                value="{{ request.POST.firstName }}"
                                class="w-full rounded-md border border-gray-300 px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                            />
                        </div>

                        <div class="space-y-2">
                            <label for="lastName" class="block text-sm font-medium text-gray-700">Nom</label>
                            <input
                                id="lastName"
                                name="lastName"
                                type="text"
                                required
                                value="{{ request.POST.lastName }}"
                                class="w-full rounded-md border border-gray-300 px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                            />
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label for="email" class="block text-sm font-medium text-gray-700">Adresse email</label>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            required
                            value="{{ request.POST.email }}"
                            class="w-full rounded-md border border-gray-300 px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        />
                    </div>

                    <div class="space-y-2">
                        <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            required
                            class="w-full rounded-md border border-gray-300 px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        />
                    </div>

                    <div class="space-y-4">
                        <div class="flex items-center space-x-2">
                            <input
                                id="terms"
                                name="terms"
                                type="checkbox"
                                required
                                class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded"
                            />
                            <label for="terms" class="text-sm text-gray-600 cursor-pointer">
                                J'accepte les
                                <a href="#" class="text-indigo-600 hover:text-indigo-500"> Conditions d'utilisation </a>
                                et l'
                                <a href="#" class="text-indigo-600 hover:text-indigo-500">Avis de confidentialité</a>.
                            </label>
                        </div>
                    </div>

                    <button
                        type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-md transition-colors"
                    >
                        Inscription
                    </button>

                    <div class="text-center mt-4">
                        <p class="text-sm text-gray-600">
                            Vous avez déjà un compte ?
                            <a href="{% url 'login' %}" class="text-indigo-600 hover:text-indigo-500"> Connexion </a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
{% endblock %}
